name: pages

# Builds and deploys GitHub Pages from the repository root of main, through
# Jekyll (the markdown documents are served as pages). _config.yml excludes
# the files that are not pages: src, references, licences, output, node_modules.
# Pages are served at https://billpage.github.io/oziewicz/
#
# One-time setting: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions" (instead of "Deploy from a branch").
#
# From the output branch, which is pushed without individual review (see
# AI-USE.md), only narrated slide pages are published, and only those in
# narrated/ whose SHA-256 is listed in talks/narrated.sha256 on main. The hash
# list is reviewed in a pull request, so a page is served only in the exact
# form that was reviewed. A file whose hash does not match fails the build.
# Pushing to output does not start this workflow; run it from the Actions tab
# (Run workflow) or with `gh workflow run pages.yml`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the narrated pages from the output branch
        uses: actions/checkout@v4
        with:
          ref: output
          path: _output
          sparse-checkout: narrated

      - uses: actions/configure-pages@v5

      - name: Build the repository root with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site

      - name: Add the narrated pages whose hashes are listed on main
        run: |
          list="$GITHUB_WORKSPACE/talks/narrated.sha256"
          if [ ! -s "$list" ]; then echo "no narrated pages listed"; exit 0; fi
          (cd _output/narrated && sha256sum --check --strict "$list")
          sudo mkdir -p _site/narrated
          awk '{print $2}' "$list" | while read -r f; do
            sudo cp "_output/narrated/$f" _site/narrated/
          done
          ls -l _site/narrated

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
